# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: ARCANA
wiki-title: Arcana Wiki
docs-title: Documentation
email: contact@voidwarex.com
author: Uriel Ballinas, VOIDWARE Prohibited
copyright: "Copyright © 2016-{currentYear} {author}"
description: Seize the Means of Animation
domain: arcana.github.io       # if you want to force HTTPS, specify the domain without the http at the start, e.g. example.com
url: https://arcana.voidwarex.com  # the base hostname and protocol for your site, e.g. http://example.com
baseurl:       # place folder name if the site is served in a subfolder
wiki-baseurl: /wiki
docs-baseurl: /docs
twitter_username: voidwarex
codeberg_username: Voidware-Prohibited
github_username:  Voidware-Prohibited
favicon_filename: favicon.ico
splash_filename: splash.png
glyph_filename: glyph.png
icon_filename: icon.png

# Default theme colors as below:
# coolblack: #090a0b
# spacegrey: #353535
# snowwhite: #ffffff
#
# theme_color: snowwhite
#
# Custom color as below:
# theme_color: "#882250"

# You can choose a brand color
# Default brand colors as below:
# orangered: #ff5100
# greatgold: #f2cb05
# greenblue: #389092
#
# brand_color: orangered
#
# Custom color as below:
# brand_color: "#1a8e42"

# You can custom selection style
# selection:
#   color: "#ff00ff"
#   background_color: "yellow"

# Page default value
defaults:
 home:
   heading: "MAKE MAGIC"
   subheading: "Materialize Interactivity"
   banner: "Your image url"


# Build settings
# theme: jekyll-theme-yat
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-mentions
  - jemoji
  - jekyll-paginate
  - jekyll-spaceship

defaults:
  - scope:
      path: "wiki" # Path relative to root
    values:
      layout: "wiki"
      on_feed: false

header_pages:
  - about.md
  - wiki.md
  - docs.md
  - license.md

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
