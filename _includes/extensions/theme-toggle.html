<button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Theme" onclick="handleThemeToggle()"></button>

<script>
    const themeMode = {
        LIGHT: 'light',
        DARK: 'dark',
        AUTO: 'auto'
    };

    const themeSymbols = {
        [themeMode.LIGHT]: '☀️',
        [themeMode.DARK]: '🌙',
        [themeMode.AUTO]: '🌓'
    };

    function saveThemeData(theme) {
        localStorage.setItem('theme', theme);
    }

    function loadThemeData() {
        return localStorage.getItem('theme');
    }

    function updateToggleButton(theme) {
        const toggleBtn = document.getElementById('theme-toggle');
        if (toggleBtn) {
            toggleBtn.textContent = themeSymbols[theme] || themeSymbols[themeMode.AUTO];
        }
    }

    function autoThemeToggle() {
        const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? themeMode.DARK : themeMode.LIGHT;
        document.documentElement.setAttribute('data-theme', systemTheme);
        updateToggleButton(themeMode.AUTO);
    }

    function handleThemeToggle() {
        let currentTheme = loadThemeData();
        let nextTheme;

        if (!currentTheme || currentTheme === themeMode.AUTO) {
            nextTheme = themeMode.LIGHT;
        } else if (currentTheme === themeMode.LIGHT) {
            nextTheme = themeMode.DARK;
        } else {
            nextTheme = themeMode.AUTO;
        }

        saveThemeData(nextTheme);

        if (nextTheme === themeMode.AUTO) {
            autoThemeToggle();
        } else {
            document.documentElement.setAttribute('data-theme', nextTheme);
            updateToggleButton(nextTheme);
        }
    }

    (function initTheme() {
        const savedTheme = loadThemeData();
        if (!savedTheme || savedTheme === themeMode.AUTO) {
            autoThemeToggle();
        } else {
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateToggleButton(savedTheme);
        }

        // Watch for system preference changes if in auto mode
        window.matchMedia('(prefers-color-scheme: dark)').addListener(() => {
            if (loadThemeData() === themeMode.AUTO || !loadThemeData()) {
                autoThemeToggle();
            }
        });
    })();
</script>

<style>
    .theme-toggle-btn {
        background: none;
        border: none;
        font-size: 1.5rem;
        cursor: pointer;
        padding: 0.5rem;
        user-select: none;
        transition: transform 0.2s ease;
    }
    .theme-toggle-btn:hover {
        transform: scale(1.1);
    }
    .theme-toggle-btn:focus {
        outline: none;
    }
</style>
