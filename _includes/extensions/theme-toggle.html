<button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Theme" onclick="handleThemeToggle()"></button>

<script>
    const themeMode = {
        LIGHT: 'light',
        DARK: 'dark'
    };

    const themeSymbols = {
        [themeMode.LIGHT]: `<svg xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="theme-icon"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`,
        [themeMode.DARK]: `<svg xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="theme-icon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`
    };

    function saveThemeData(theme) {
        localStorage.setItem('theme', theme);
    }

    function loadThemeData() {
        return localStorage.getItem('theme');
    }

    function updateToggleButton(theme) {
        const toggleBtn = document.getElementById('theme-toggle');
        if (toggleBtn) {
            toggleBtn.innerHTML = themeSymbols[theme];
        }
    }

    function autoThemeToggle() {
        const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? themeMode.DARK : themeMode.LIGHT;
        document.documentElement.setAttribute('data-theme', systemTheme);
        updateToggleButton(systemTheme);
    }

    function handleThemeToggle() {
        let currentTheme = loadThemeData();
        
        if (!currentTheme) {
            currentTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? themeMode.DARK : themeMode.LIGHT;
        }

        const nextTheme = currentTheme === themeMode.LIGHT ? themeMode.DARK : themeMode.LIGHT;

        saveThemeData(nextTheme);
        document.documentElement.setAttribute('data-theme', nextTheme);
        updateToggleButton(nextTheme);
    }

    (function initTheme() {
        const savedTheme = loadThemeData();
        if (!savedTheme) {
            autoThemeToggle();
        } else {
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateToggleButton(savedTheme);
        }

        window.matchMedia('(prefers-color-scheme: dark)').addListener(() => {
            if (!loadThemeData()) {
                autoThemeToggle();
            }
        });
    })();
</script>

<style>
    .theme-toggle-btn {
        background: none;
        border: none;
        cursor: pointer;
        padding: 0.5rem;
        user-select: none;
        transition: transform 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .theme-icon {
        width: 1.5rem;
        height: 1.5rem;
        color: var(--text-color, currentColor); /* Adapts to your theme CSS if text color variables are set */
    }
    .theme-toggle-btn:hover {
        transform: scale(1.1);
    }
    .theme-toggle-btn:focus {
        outline: none;
    }
</style>
