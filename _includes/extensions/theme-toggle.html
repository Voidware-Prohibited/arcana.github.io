<button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Theme" onclick="handleThemeToggle()"></button>

<script>
    const themeMode = {
        LIGHT: 'light',
        DARK: 'dark'
    };

    const themeSymbols = {
        [themeMode.LIGHT]: '☀️',
        [themeMode.DARK]: '🌙'
    };

    function saveThemeData(theme) {
        localStorage.setItem('theme', theme);
    }

    function loadThemeData() {
        return localStorage.getItem('theme');
    }

    function updateToggleButton(theme) {
        const toggleBtn = document.getElementById('theme-toggle');
        if (toggleBtn) {
            toggleBtn.textContent = themeSymbols[theme];
        }
    }

    function autoThemeToggle() {
        const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? themeMode.DARK : themeMode.LIGHT;
        document.documentElement.setAttribute('data-theme', systemTheme);
        updateToggleButton(systemTheme);
    }

    function handleThemeToggle() {
        let currentTheme = loadThemeData();
        
        // Fallback to system preference if localStorage hasn't been set yet
        if (!currentTheme) {
            currentTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? themeMode.DARK : themeMode.LIGHT;
        }

        const nextTheme = currentTheme === themeMode.LIGHT ? themeMode.DARK : themeMode.LIGHT;

        saveThemeData(nextTheme);
        document.documentElement.setAttribute('data-theme', nextTheme);
        updateToggleButton(nextTheme);
    }

    (function initTheme() {
        const savedTheme = loadThemeData();
        if (!savedTheme) {
            autoThemeToggle();
        } else {
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateToggleButton(savedTheme);
        }

        // Listen for system changes ONLY if the user hasn't explicitly selected a preference yet
        window.matchMedia('(prefers-color-scheme: dark)').addListener(() => {
            if (!loadThemeData()) {
                autoThemeToggle();
            }
        });
    })();
</script>

<style>
    .theme-toggle-btn {
        background: none;
        border: none;
        font-size: 1.5rem;
        cursor: pointer;
        padding: 0.5rem;
        user-select: none;
        transition: transform 0.2s ease;
    }
    .theme-toggle-btn:hover {
        transform: scale(1.1);
    }
    .theme-toggle-btn:focus {
        outline: none;
    }
</style>
